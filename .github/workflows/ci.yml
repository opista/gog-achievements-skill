name: Validate skill

"on":
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      release-tag:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: python scripts/package.py
        if: inputs.release-tag == ''
      - name: Build and verify release assets
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/release.py build --tag "$RELEASE_TAG"
        shell: bash
      - name: Probe native CLI release
        if: runner.os != 'Linux'
        run: python scripts/smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: gog-achievements-skill-${{ runner.os }}
          path: dist/gog-achievements-skill.zip
          if-no-files-found: error
        if: inputs.release-tag == ''
      - uses: actions/upload-artifact@v7
        if: inputs.release-tag != ''
        with:
          name: distribution-${{ runner.os }}
          path: dist/release/*
          if-no-files-found: error
